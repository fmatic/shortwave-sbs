<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>shortwave.sbs TX Map</title>
				<link rel="stylesheet" href="style.css?v=0.4.9">
					<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
						<style>
    body {
      overflow: hidden;
    }

    .map-page {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .map-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(10,15,24,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10;
    }

    .map-title {
      display: grid;
      gap: 2px;
    }

    .map-title strong {
      color: var(--accent);
      font-size: 20px;
    }

    .map-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .map-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .map-button {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(94,234,212,.28);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(94,234,212,.06);
      font-size: 13px;
      font-weight: 700;
    }

    #txMap {
      height: 100%;
      width: 100%;
      background: var(--bg);
    }

    .leaflet-container {
      background: #071018;
      color: var(--text);
      font-family: inherit;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0d1420;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.10);
    }

    .tx-popup strong {
      color: var(--accent);
      font-size: 15px;
    }

    .tx-popup small {
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    .tx-popup ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .tx-popup li {
      margin: 3px 0;
    }
	
.map-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.map-band-switcher {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: none;
  -ms-overflow-style: none;

  max-width: min(72vw, 760px);

  padding-bottom: 2px;

  -webkit-overflow-scrolling: touch;
}

.map-band-switcher::-webkit-scrollbar {
  display: none;
}

.map-band-btn {
  appearance: none;
  -webkit-appearance: none;

  flex: 0 0 auto;

  border: 1px solid rgba(94,234,212,.22);
  border-radius: 999px;

  background: rgba(94,234,212,.055);
  color: var(--muted);

  padding: 7px 10px;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;

  transition:
    border-color .18s ease,
    background .18s ease,
    color .18s ease;
}

.map-band-btn:hover {
  border-color: rgba(94,234,212,.45);
  color: var(--text);
}

.map-band-btn.active {
  color: var(--accent);
  border-color: rgba(94,234,212,.55);
  background: rgba(94,234,212,.13);

  box-shadow:
    0 0 14px rgba(94,234,212,.08);
}

@media (max-width: 760px) {
  .map-topbar {
    flex-direction: column;
    align-items: stretch;
  }

  .map-actions {
    width: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }

  .leaflet-overlay-pane svg path {
  fill: rgba(15,23,42,.42);
  stroke: rgba(96,165,250,.95);
  stroke-width: 2px;
}

  .map-band-switcher {
    max-width: 100%;
  }

.tx-marker {
  filter: drop-shadow(0 0 4px rgba(94,234,212,.35));
}

.tx-marker-target {
  filter:
    drop-shadow(0 0 5px rgba(94,234,212,.55))
    drop-shadow(0 0 10px rgba(94,234,212,.18));
}

.tx-marker-target {
  animation: txPulse 3.8s ease-in-out infinite;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: rgba(13,20,32,.96);
  color: var(--text);
  border: 1px solid rgba(94,234,212,.18);
  box-shadow:
    0 18px 50px rgba(0,0,0,.45),
    0 0 18px rgba(94,234,212,.08);
}

.leaflet-popup-content {
  margin: 12px 14px;
}

.tx-popup strong {
  color: var(--accent);
}

.tx-popup small {
  color: var(--muted);
}

.tx-popup b {
  color: var(--accent);
}

@keyframes txPulse {
  0%, 100% {
    opacity: .92;
    filter: drop-shadow(0 0 2px rgba(94,234,212,.18));
  }

  50% {
    opacity: .58;
    filter: drop-shadow(0 0 10px rgba(94,234,212,.32));
  }
}

  .map-button {
    align-self: flex-start;
  }
}
						</style>
					</head>
					<body>
  <div class="map-page">
    <header class="map-topbar">
      <div class="map-title">
        <strong id="mapTitle">shortwave.sbs TX Map</strong>
        <span id="mapInfo">Loading transmitter sites…</span>
      </div>

      <div class="map-actions">
        <div id="mapBandSwitcher" class="map-band-switcher"></div>
        <a class="map-button" href="index.html">← Schedule</a>
      </div>
    </header>

    <div id="txMap"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="map.js?v=0.7.4"></script>
</body>
				</html>
