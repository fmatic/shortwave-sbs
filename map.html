<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>shortwave.sbs TX Map</title>

  <link rel="stylesheet" href="style.css?v=0.4.9">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      overflow: hidden;
    }

    .map-page {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .map-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(10,15,24,.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10;
    }

    .map-title {
      display: grid;
      gap: 2px;
    }

    .map-title strong {
      color: var(--accent);
      font-size: 20px;
    }

    .map-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .map-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .map-button {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(94,234,212,.28);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(94,234,212,.06);
      font-size: 13px;
      font-weight: 700;
    }

    #txMap {
      height: 100%;
      width: 100%;
      background: var(--bg);
    }

    .leaflet-container {
      background: #071018;
      color: var(--text);
      font-family: inherit;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0d1420;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.10);
    }

    .tx-popup strong {
      color: var(--accent);
      font-size: 15px;
    }

    .tx-popup small {
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    .tx-popup ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .tx-popup li {
      margin: 3px 0;
    }
  </style>
</head>

<body>
  <div class="map-page">
    <header class="map-topbar">
      <div class="map-title">
        <strong>shortwave.sbs TX Map</strong>
        <span id="mapInfo">Loading transmitter sites…</span>
      </div>

      <div class="map-actions">
        <a class="map-button" href="index.html">← Schedule</a>
      </div>
    </header>

    <div id="txMap"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js?v=0.4.9"></script>
</body>
</html>
